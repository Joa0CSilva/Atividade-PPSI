<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta
      name="description"
      content="A ConnectX oferece produtos, serviços e soluções de tecnologia, informática e conectividade no centro de São Roque - SP, com atendimento de qualidade e confiança."/>

    <link rel="stylesheet" href="../css/contato.css"/>
    <link rel="icon" type="image/png" href="../icon/favicon.png">

    <title>ConnectX</title>
  </head>

  <body id="inicio">
    <header>
      <img src="../images/logo.png" alt="ConnectX" class="logo"/>

      <nav>
        <a href="../../index.html">Home</a>
        <a href="./sobre.html">Sobre</a>
        <a href="./produtos.html">Produtos</a>
      </nav>
    </header>

    <main>
        <section class="contato">
            <h2 id="titulo">Contato</h2>

            <div id="formulario">
                <form method="post">
                    <label for="name">Nome</label>
                    <input type="text"
                    id="nome"
                    required>

                    <label for="email">Email</label>
                    <input type="email"
                    id="email"
                    required>

                    <label for="telefone">Telefone</label>
                    <input type="tel"
                    id="telefone"
                    pattern="[0-9]{11}"
                    required>

                    <label for="assunto">Assunto</label>
                    <input type="text"
                    id="assunto"
                    required>

                    <label for="mensagem">Mensagem</label>
                    <textarea name="mensagem" id="mensagem"></textarea>

                    <button type="submit" id="enviar">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
      <img src="../images/logo.png" alt="ConnectX" class="logo"/>

      <nav>
        <a href="../../index.html">Inicio</a>
        <a href="./sobre.html">Sobre</a>
        <a href="./produtos.html">Produtos</a>
      </nav>
    </footer>

  </body>
</html>
