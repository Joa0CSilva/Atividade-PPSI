<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta
      name="description"
      content="A ConnectX oferece produtos, serviços e soluções de tecnologia, informática e conectividade no centro de São Roque - SP, com atendimento de qualidade e confiança."/>

    <link rel="stylesheet" href="../css/contato.css"/>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="icon" type="image/png" href="../icon/favicon.png">

    <script src="../javascript/script.js"></script>

    <title>ConnectX</title>
  </head>

  <body id="inicio">
    <header>
      <a href="../../index.html"><img src="../images/logo.png" alt="ConnectX" class="logo"/></a>

      <nav>
        <a href="./sobre.html">Sobre</a>
        <a href="./produtos.html">Produtos</a>
        <a href="contato.html">Contato</a>
      </nav>
    </header>

    <main>
        <section class="contato">
            <h2 id="titulo">Contato</h2>

            <section class="informacoes">
                <h3>Informações da Loja</h3>

                <p>📍 Centro de São Roque - SP</p>
                <p>📞 (11) 99999-9999</p>
                <p>✉ contato@connectx.com.br</p>
                <p>🕒 Segunda a Sexta: 09h às 18h</p>
            </section>

            <div id="formulario">
                <form method="post">
                    <label for="name">Nome</label>
                    <input type="text"
                    id="nome"
                    required>

                    <label for="email">Email</label>
                    <input type="email"
                    id="email"
                    required>

                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option>Selecione uma categoria</option>    
                        <option value="suporte">Suporte</option>
                        <option value="cotacao">Manutenção</option>
                        <option value="outros">Outros</option>
                    </select>
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" required></textarea>

                    <input type="hidden" name="text" value="" id="mensagem-completa" >
                    <button type="button" id="enviar" onclick="enviarMensagem()">Enviar mensagem</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
      <img src="../images/logo.png" alt="ConnectX" class="logo"/>

      <nav>
        <a href="./sobre.html">Sobre</a>
        <a href="./produtos.html">Produtos</a>
        <a href="contato.html">Contato</a>
      </nav>
    </footer>

  </body>
</html>
